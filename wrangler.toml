name = "easypu"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Cloudflare R2 Bucket Binding
[[r2_buckets]]
binding = "EASYPU_BUCKET"
bucket_name = "easypu"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "Easypu-db"
database_id = "853d61e5-ed5c-4147-ba04-c42a73c70f25"

# 环境变量配置 (公开非敏感变量)
# 敏感密钥 (如 RESEND_API_KEY) 请在 Cloudflare 控制台添加为「机密 (Secret)」
[vars]
CLOUDFLARE_DOMAIN = "pu.fangwengudao.us.kg"
APP_NAME = "Easypu"
RESEND_FROM_EMAIL = "Easypu 简谱 <verify@fangwengudao.us.kg>"


